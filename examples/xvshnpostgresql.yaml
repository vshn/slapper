# Requires Crossplane + the generated XRD/Composition + functions/provider.
# See README "Getting started" or run:
#   slap examples/servicebundle.yaml
#   kubectl apply -f examples/bootstrap/
#   kubectl apply -f xpkg/xrd.yaml -f xpkg/composition.yaml
apiVersion: appslap.io/v1alpha1
kind: XVSHNPostgreSQL
metadata:
  name: my-pg
  namespace: default
spec:
  parameters:
    plan: small
    instances: 1
    maintenance:
      schedule: "0 3 * * 0"
    service:
      majorVersion: "16"
      database: app
      user: appuser
